# Faz o papel do ALB: round robin entre as duas "instâncias".
# Um worker só, para o round robin ser global (com vários workers cada um
# começa pelo primeiro servidor).
worker_processes 1;
events {}
http {
    upstream asg {
        server 169.254.169.10:80;
        server 169.254.169.20:80;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://asg;
            add_header X-Instancia $upstream_addr always;
        }
    }
}
