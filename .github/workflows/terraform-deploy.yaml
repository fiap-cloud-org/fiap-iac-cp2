name: Terraform Deploy

# Só roda manualmente (Actions > Terraform Deploy > Run workflow).
# Precisa dos secrets da AWS e do backend; veja "Como rodar" no README.
on:
  workflow_dispatch:
    inputs:
      action:
        description: O que fazer
        type: choice
        options: [plan, apply, destroy]
        default: plan
        required: true

permissions:
  contents: read

concurrency:
  group: terraform-aws
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.9.8
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_key_name: ${{ vars.AWS_KEY_NAME }}

jobs:
  terraform:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # O backend é configurado por -backend-config com valores dos secrets;
      # nome de bucket e tabela não ficam no código.
      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: >-
          terraform init
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE"
          -backend-config="key=fiap-iac-cp2/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="encrypt=true"

      - run: terraform validate

      - name: terraform plan
        if: inputs.action == 'plan'
        run: terraform plan

      - name: terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve

      - name: terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Outputs
        if: inputs.action == 'apply'
        run: terraform output
